  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 30s
    keep-alive-timeout: 30s
    max-connections: 1000

# HTTP Client timeouts for RestTemplate
http:
  client:
    connect-timeout: 10000
    read-timeout: 30000

# If using Feign client
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 30000

